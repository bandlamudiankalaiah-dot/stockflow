# Render blueprint for the StockFlow API.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
# Render provisions PostgreSQL, wires DATABASE_URL and generates JWT_SECRET_KEY.
# After the first deploy, set CORS_ORIGINS to your Vercel URL, then copy the
# service URL into Vercel as VITE_API_URL and redeploy the frontend.

databases:
  - name: stockflow-db
    databaseName: stockflow
    user: stockflow
    plan: free

services:
  - type: web
    name: stockflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      # Set this to the deployed frontend origin, e.g. https://stockflow.vercel.app
      # The API also accepts any *.vercel.app / *.style.dev origin by default.
      - key: CORS_ORIGINS
        sync: false
